services:

  identity-service:
    build: ../services/identity-service
    ports:
      - "3001:3001"
    env_file:
      - ../services/identity-service/.env
    networks:
      - vendex-infra

  order-service:
    build: ../services/orders-service
    ports:
      - "3004:3004"
    env_file:
      - ../services/orders-service/.env
    networks:
      - vendex-infra

  catalog-service:
    build: ../services/catalog-service
    ports:
      - "3003:3003"
    env_file:
      - ../services/catalog-service/.env
    networks:
      - vendex-infra

  analytics-service:
    build: ../services/analytics-service
    ports:
      - "3000:3000"
    env_file:
      - ../services/analytics-service/.env
    networks:
      - vendex-infra

  messaging-service:
    build: ../services/messaging-service
    ports:
      - "3002:3002"
    env_file:
      - ../services/messaging-service/.env
    networks:
      - vendex-infra

  payment-service:
    build: ../services/payment-service
    ports:
      - "3005:3005"
    env_file:
      - ../services/payment-service/.env
    networks:
      - vendex-infra

networks:
  vendex-infra:
    external: true