---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infrastructure-access-policy
  namespace: default
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - mongodb-service
      - kafka-service
      - redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - identity-service
          - catalog-service
          - order-service
          - payment-service
          - messaging-service
          - analytics-service
          - mail-worker
          - notification-worker
