apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
      - name: kong
        image: kong:3.4-alpine
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /usr/local/kong/kong.yml
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_LOG_LEVEL
          value: info
        ports:
        - name: proxy
          containerPort: 8000
        volumeMounts:
        - name: kong-config
          mountPath: /usr/local/kong
          readOnly: true
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
