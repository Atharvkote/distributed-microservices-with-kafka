apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: atharvakote/payment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: SERVER_PORT
          value: "3005"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: SALT_ROUNDS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SALT_ROUNDS
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_SECRET
        - name: JWT_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_EXPIRATION
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_URL
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BROKERS
        - name: CLOUNDINARY_CLOUD_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CLOUNDINARY_CLOUD_NAME
        - name: CLOUNDINARY_API_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CLOUNDINARY_API_KEY
        - name: CLOUNDINARY_API_SECRET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CLOUNDINARY_API_SECRET
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: MONGODB_URI_PAYMENT
        - name: RAZORPAY_KEY_ID
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: RAZORPAY_KEY_ID
        - name: RAZORPAY_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: RAZORPAY_KEY_SECRET
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"